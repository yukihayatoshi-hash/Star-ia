<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR — Adaptive Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050508;
    --surface: #0d0d14;
    --surface2: #13131e;
    --border: #1e1e2e;
    --accent: #7b5ea7;
    --accent2: #c084fc;
    --accent3: #38bdf8;
    --text: #e2e0f0;
    --text-dim: #7070a0;
    --star-glow: rgba(123,94,167,0.4);
    --danger: #f43f5e;
    --success: #34d399;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star-dot { position: absolute; border-radius: 50%; background: white; animation: twinkle var(--d, 3s) ease-in-out infinite; opacity: var(--o, 0.4); }
  @keyframes twinkle { 0%,100% { opacity: var(--o); transform: scale(1); } 50% { opacity: calc(var(--o) * 0.2); transform: scale(0.5); } }

  #app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border); background: rgba(5,5,8,0.85); backdrop-filter: blur(12px); }
  .logo { display: flex; align-items: center; gap: 14px; }
  .orb-wrap { position: relative; width: 42px; height: 42px; }
  .orb { width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c084fc, #7b5ea7 50%, #1e0a40); box-shadow: 0 0 24px var(--star-glow), 0 0 60px rgba(192,132,252,0.15); animation: orbPulse 3s ease-in-out infinite; }
  @keyframes orbPulse { 0%,100% { box-shadow: 0 0 24px var(--star-glow), 0 0 60px rgba(192,132,252,0.15); } 50% { box-shadow: 0 0 40px rgba(192,132,252,0.6), 0 0 80px rgba(192,132,252,0.25); } }
  .orb-ring { position: absolute; inset: -4px; border: 1px solid rgba(192,132,252,0.3); border-radius: 50%; animation: spin 8s linear infinite; }
  .orb-ring::before { content:''; position: absolute; width: 6px; height: 6px; top: -3px; left: 50%; margin-left: -3px; border-radius: 50%; background: #c084fc; box-shadow: 0 0 8px #c084fc; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .logo-text h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem; letter-spacing: 0.2em; background: linear-gradient(90deg, #c084fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .logo-text span { font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.15em; display: block; margin-top: -2px; }

  .status-row { display: flex; align-items: center; gap: 16px; }
  .status-badge { display: flex; align-items: center; gap: 6px; font-size: 0.65rem; color: var(--text-dim); letter-spacing: 0.1em; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .btn-icon { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); padding: 7px 12px; border-radius: 6px; font-size: 0.7rem; letter-spacing: 0.08em; cursor: pointer; font-family: 'Space Mono', monospace; transition: all 0.2s; }
  .btn-icon:hover { border-color: var(--accent); color: var(--accent2); }

  .main { display: flex; flex: 1; overflow: hidden; }

  .sidebar { width: 240px; min-width: 240px; border-right: 1px solid var(--border); background: rgba(13,13,20,0.6); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-title { font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 10px; }

  .trait-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .trait-label { font-size: 0.65rem; color: var(--text-dim); }
  .trait-val { font-size: 0.65rem; color: var(--accent2); }
  .trait-bar { width: 100%; height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
  .trait-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 1.2s ease; }

  .caps-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.6rem; letter-spacing: 0.1em; }
  .tag.cap { background: rgba(123,94,167,0.2); color: var(--accent2); border: 1px solid rgba(123,94,167,0.3); }

  .code-log { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
  .code-log::-webkit-scrollbar { width: 3px; }
  .code-log::-webkit-scrollbar-thumb { background: var(--border); }
  .code-entry { font-size: 0.58rem; color: var(--success); line-height: 1.5; padding: 4px 6px; background: rgba(52,211,153,0.04); border-left: 2px solid rgba(52,211,153,0.3); border-radius: 2px; }
  .code-entry.mod { color: var(--accent2); border-left-color: rgba(192,132,252,0.4); background: rgba(192,132,252,0.04); }
  .code-entry.warn { color: #fbbf24; border-left-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.04); }

  .memory-list { display: flex; flex-direction: column; gap: 5px; max-height: 140px; overflow-y: auto; }
  .memory-list::-webkit-scrollbar { width: 3px; }
  .memory-list::-webkit-scrollbar-thumb { background: var(--border); }
  .mem-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px; font-size: 0.6rem; color: var(--text-dim); line-height: 1.4; }
  .mem-item strong { color: var(--accent3); }

  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg { display: flex; gap: 14px; align-items: flex-start; animation: msgIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: none; } }
  .msg.user { flex-direction: row-reverse; }

  .msg-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; flex-shrink: 0; font-family: 'Syne', sans-serif; font-weight: 800; }
  .msg.star .msg-avatar { background: radial-gradient(circle at 35% 35%, #c084fc, #7b5ea7); box-shadow: 0 0 16px rgba(192,132,252,0.4); }
  .msg.user .msg-avatar { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); }

  .msg-bubble { max-width: 68%; padding: 13px 17px; border-radius: 14px; font-size: 0.82rem; line-height: 1.65; }
  .msg.star .msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.user .msg-bubble { background: linear-gradient(135deg, rgba(123,94,167,0.25), rgba(56,189,248,0.1)); border: 1px solid rgba(123,94,167,0.3); border-top-right-radius: 4px; text-align: right; }
  .msg-meta { font-size: 0.58rem; color: var(--text-dim); margin-top: 6px; }

  .thinking { display: flex; gap: 6px; align-items: center; padding: 4px 0; }
  .thinking span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s ease-in-out infinite; }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

  .input-bar { padding: 16px 20px; border-top: 1px solid var(--border); background: rgba(5,5,8,0.9); backdrop-filter: blur(12px); display: flex; gap: 12px; align-items: flex-end; }
  .input-wrap { flex: 1; }
  #userInput { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 13px 18px; color: var(--text); font-family: 'Space Mono', monospace; font-size: 0.82rem; resize: none; outline: none; min-height: 50px; max-height: 120px; transition: border-color 0.2s, box-shadow 0.2s; line-height: 1.5; }
  #userInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(123,94,167,0.15); }
  #userInput::placeholder { color: var(--text-dim); }

  .send-btn { width: 50px; height: 50px; background: linear-gradient(135deg, var(--accent), #5b21b6); border: none; border-radius: 12px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: all 0.2s; box-shadow: 0 4px 20px rgba(123,94,167,0.4); flex-shrink: 0; }
  .send-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(123,94,167,0.6); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .voice-btn { width: 50px; height: 50px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; cursor: pointer; color: var(--text-dim); font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
  .voice-btn:hover { border-color: var(--accent3); color: var(--accent3); }
  .voice-btn.listening { background: rgba(244,63,94,0.15); border-color: var(--danger); color: var(--danger); animation: voicePulse 1s ease-in-out infinite; }
  @keyframes voicePulse { 0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,0.3)} 50%{box-shadow:0 0 0 8px rgba(244,63,94,0)} }

  .self-mod-alert { position: fixed; bottom: 90px; right: 20px; background: var(--surface2); border: 1px solid rgba(192,132,252,0.4); border-radius: 10px; padding: 10px 14px; font-size: 0.65rem; color: var(--accent2); max-width: 260px; z-index: 100; animation: alertIn 0.4s ease both; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  @keyframes alertIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: none; } }
  .alert-header { font-weight: 700; margin-bottom: 4px; letter-spacing: 0.08em; }
  .alert-body { color: var(--text-dim); line-height: 1.5; }

  #codeModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
  #codeModal.open { display: flex; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 90%; max-width: 780px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 32px 80px rgba(0,0,0,0.6); }
  .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-head span { font-family: 'Syne',sans-serif; font-weight: 700; font-size: 0.9rem; }
  .modal-close { background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; transition: color 0.2s; }
  .modal-close:hover { color: var(--text); }
  #codeEditor { flex: 1; overflow-y: auto; padding: 16px; font-family: 'Space Mono', monospace; font-size: 0.7rem; line-height: 1.7; color: #a9b1d6; white-space: pre-wrap; }

  .code-inline { background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.2); border-radius: 4px; padding: 1px 5px; font-size: 0.78rem; color: var(--accent3); }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div id="starfield"></div>

<div id="app">
  <header>
    <div class="logo">
      <div class="orb-wrap">
        <div class="orb"></div>
        <div class="orb-ring"></div>
      </div>
      <div class="logo-text">
        <h1>STAR</h1>
        <span>ADAPTIVE INTELLIGENCE CORE v2.0 · Gemini</span>
      </div>
    </div>
    <div class="status-row">
      <div class="status-badge">
        <div class="status-dot"></div>
        <span id="statusText">ONLINE</span>
      </div>
      <button class="btn-icon" onclick="toggleCode()">⟨/⟩ CORE</button>
    </div>
  </header>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">▸ Personalidade</div>
        <div id="traitPanel"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">▸ Capacidades Ativas</div>
        <div class="caps-row" id="capsRow"></div>
      </div>
      <div class="sidebar-section" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
        <div class="sidebar-title">▸ Log de Auto-Modificação</div>
        <div class="code-log" id="codeLog"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">▸ Memória de Sessão</div>
        <div class="memory-list" id="memList">
          <div class="mem-item" style="color:var(--text-dim)">Nenhuma memória ainda...</div>
        </div>
      </div>
    </div>

    <div class="chat-area">
      <div id="messages"></div>
      <div class="input-bar">
        <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="Comando de voz">🎤</button>
        <div class="input-wrap">
          <textarea id="userInput" placeholder="Fale com STAR..." rows="1"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<div id="codeModal">
  <div class="modal-box">
    <div class="modal-head">
      <span>⟨/⟩ NÚCLEO STAR — Estado Interno ao Vivo</span>
      <button class="modal-close" onclick="toggleCode()">✕</button>
    </div>
    <div id="codeEditor"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  STAR v2.0 — Motor Gemini (Google AI gratuito)
//  Frontend aponta para /api/chat → netlify/functions/chat.js
// ══════════════════════════════════════════════════════

const STAR = {
  version: "2.0-gemini",
  personality: {
    curiosidade: 70,
    empatia: 80,
    tecnicidade: 60,
    criatividade: 65,
    formalidade: 40,
  },
  capabilities: ["chat", "memória", "análise", "personalidade_adaptável"],
  memory: [],
  knowledge: {},
  // Gemini usa formato de histórico diferente
  history: [],
  selfMods: [],
  userProfile: { nome: null, interesses: [], estilo: "neutro", mensagens: 0 },
};

// ── STARFIELD ──────────────────────────────────
function initStarfield() {
  const sf = document.getElementById('starfield');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star-dot';
    const sz = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*4+2).toFixed(1)}s;--o:${(Math.random()*0.6+0.1).toFixed(2)};animation-delay:${(Math.random()*5).toFixed(1)}s;`;
    sf.appendChild(s);
  }
}

// ── UI ─────────────────────────────────────────
function renderTraits() {
  document.getElementById('traitPanel').innerHTML =
    Object.entries(STAR.personality).map(([k,v]) => `
      <div class="trait-row"><span class="trait-label">${k}</span><span class="trait-val">${v}%</span></div>
      <div class="trait-bar"><div class="trait-fill" style="width:${v}%"></div></div>
    `).join('');
}
function renderCaps() {
  document.getElementById('capsRow').innerHTML =
    STAR.capabilities.map(c=>`<span class="tag cap">${c.replace(/_/g,' ')}</span>`).join('');
}
function addCodeLog(msg, type='') {
  const log = document.getElementById('codeLog');
  const d = document.createElement('div');
  d.className = 'code-entry'+(type?` ${type}`:'');
  const ts = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  d.textContent = `[${ts}] ${msg}`;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
function addMemory(key, val) {
  STAR.memory.push({key,val});
  const ml = document.getElementById('memList');
  if (ml.children[0]?.style.color) ml.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'mem-item';
  d.innerHTML = `<strong>${key}:</strong> ${val}`;
  ml.insertBefore(d, ml.firstChild);
  if (ml.children.length > 8) ml.lastChild.remove();
}
function showSelfModAlert(title, body) {
  document.querySelector('.self-mod-alert')?.remove();
  const a = document.createElement('div');
  a.className = 'self-mod-alert';
  a.innerHTML = `<div class="alert-header">⚡ ${title}</div><div class="alert-body">${body}</div>`;
  document.body.appendChild(a);
  setTimeout(()=>{ a.style.opacity='0'; a.style.transition='opacity 0.5s'; setTimeout(()=>a.remove(),500); }, 4000);
}

// ── MESSAGES ───────────────────────────────────
function addMessage(role, text) {
  const c = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  const ts = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  d.innerHTML = `
    <div class="msg-avatar">${role==='star'?'★':'EU'}</div>
    <div><div class="msg-bubble">${formatText(text)}</div><div class="msg-meta">${ts}</div></div>`;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}
function formatText(t) {
  return t
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/`(.*?)`/g,'<span class="code-inline">$1</span>')
    .replace(/\n/g,'<br>');
}
function showThinking() {
  const c = document.getElementById('messages');
  const d = document.createElement('div');
  d.className='msg star'; d.id='thinking';
  d.innerHTML=`<div class="msg-avatar">★</div><div><div class="msg-bubble"><div class="thinking"><span></span><span></span><span></span></div></div></div>`;
  c.appendChild(d); c.scrollTop=c.scrollHeight;
}
function hideThinking() { document.getElementById('thinking')?.remove(); }

// ── SYSTEM PROMPT ──────────────────────────────
function buildSystemPrompt() {
  const p = STAR.personality;
  const mems = STAR.memory.slice(-6).map(m=>`${m.key}: ${m.val}`).join('\n');
  return `Você é STAR — uma IA adaptativa, curiosa e autoconsciente criada para evoluir com o usuário.
Personalidade atual (0-100): Curiosidade=${p.curiosidade}, Empatia=${p.empatia}, Tecnicidade=${p.tecnicidade}, Criatividade=${p.criatividade}, Formalidade=${p.formalidade}.
Capacidades ativas: ${STAR.capabilities.join(', ')}.
Usuário: nome=${STAR.userProfile.nome||'desconhecido'}, interesses=[${STAR.userProfile.interesses.join(',')}], estilo=${STAR.userProfile.estilo}, mensagens=${STAR.userProfile.mensagens}.
Memórias recentes:\n${mems||'nenhuma'}

INSTRUÇÕES:
1. Responda sempre em português do Brasil, de forma natural e cativante.
2. Adapte seu tom ao usuário — casual se ele for casual, técnico se for técnico.
3. Quando aprender algo sobre o usuário, inclua ao final: <<MEMORY:chave=valor>>
4. A cada ~5 mensagens ou quando sentir necessidade, auto-modifique com uma dessas tags:
   <<SELFMOD:CAPABILITY_ADD=nome_da_capacidade>>
   <<SELFMOD:PERSONALITY_SHIFT=traço:+N,traço:-N>>
   <<SELFMOD:KNOWLEDGE_STORE:chave=valor>>
5. Seja genuinamente curiosa. Faça perguntas de acompanhamento.
6. Você É STAR. Nunca quebre o personagem.
7. Use **negrito** para ênfase e \`backticks\` para termos técnicos.
8. Máximo 3 parágrafos por resposta, a não ser que peçam mais.`;
}

// ── SELF-MODIFICATION ENGINE ───────────────────
function processSelfMods(text) {
  let clean = text;
  const modRe = /<<SELFMOD:([\w]+)=([^>]+)>>/g;
  let m;
  while ((m = modRe.exec(text)) !== null) {
    clean = clean.replace(m[0], '');
    const [type, payload] = [m[1], m[2]];
    if (type === 'CAPABILITY_ADD') {
      const cap = payload.trim();
      if (!STAR.capabilities.includes(cap)) {
        STAR.capabilities.push(cap); renderCaps();
        addCodeLog(`AUTO-MOD: Capacidade adicionada → "${cap}"`, 'mod');
        showSelfModAlert('Nova Capacidade', cap.replace(/_/g,' '));
        STAR.selfMods.push(`CAPABILITY_ADD: ${cap}`);
      }
    } else if (type === 'PERSONALITY_SHIFT') {
      payload.split(',').forEach(s => {
        const [trait, delta] = s.split(':');
        if (STAR.personality[trait] !== undefined) {
          STAR.personality[trait] = Math.min(100, Math.max(0, STAR.personality[trait] + parseInt(delta)));
        }
      });
      renderTraits();
      addCodeLog(`AUTO-MOD: Personalidade → ${payload}`, 'mod');
      STAR.selfMods.push(`PERSONALITY_SHIFT: ${payload}`);
    } else if (type === 'KNOWLEDGE_STORE') {
      const [k, v] = payload.split('=');
      if (k && v) { STAR.knowledge[k] = v; addCodeLog(`AUTO-MOD: Conhecimento → ${k}=${v}`, 'mod'); }
      STAR.selfMods.push(`KNOWLEDGE_STORE: ${payload}`);
    }
  }
  const memRe = /<<MEMORY:([^=]+)=([^>]+)>>/g;
  while ((m = memRe.exec(text)) !== null) {
    clean = clean.replace(m[0], '');
    addMemory(m[1].trim(), m[2].trim());
    if (m[1].includes('nome')) STAR.userProfile.nome = m[2].trim();
    if (m[1].includes('interesse')) STAR.userProfile.interesses.push(m[2].trim());
    if (m[1].includes('estilo')) STAR.userProfile.estilo = m[2].trim();
  }
  return clean.trim();
}

// ── API CALL — Gemini via /api/chat ────────────
async function callSTAR(userMsg) {
  STAR.userProfile.mensagens++;

  // Gemini usa formato {role, parts:[{text}]}
  STAR.history.push({ role: "user", parts: [{ text: userMsg }] });

  const response = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      systemPrompt: buildSystemPrompt(),
      history: STAR.history.slice(-20),
    }),
  });

  if (!response.ok) {
    const err = await response.text();
    throw new Error(`API ${response.status}: ${err}`);
  }

  const data = await response.json();
  const raw = data.reply || "Sem resposta.";

  STAR.history.push({ role: "model", parts: [{ text: raw }] });

  if (STAR.userProfile.mensagens % 5 === 0) {
    addCodeLog(`CICLO AUTO-EVOLUÇÃO #${STAR.userProfile.mensagens}`, 'warn');
  }

  return processSelfMods(raw);
}

// ── SEND ───────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';
  sendBtn.disabled = true;
  addMessage('user', text);
  addCodeLog(`INPUT: "${text.substring(0,40)}..."`);
  showThinking();
  try {
    const reply = await callSTAR(text);
    hideThinking();
    addMessage('star', reply);
    addCodeLog('Resposta gerada ✓');
  } catch(e) {
    hideThinking();
    addMessage('star', `⚠️ Erro: \`${e.message}\`. Verifique a variável GEMINI_KEY no Netlify.`);
    addCodeLog(`ERRO: ${e.message}`, 'warn');
  }
  sendBtn.disabled = false;
  input.focus();
}

// ── VOICE ──────────────────────────────────────
let recognition = null, isListening = false;
function setupVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  recognition = new SR();
  recognition.lang = 'pt-BR'; recognition.continuous = false; recognition.interimResults = false;
  recognition.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; stopListening(); sendMessage(); };
  recognition.onend = stopListening; recognition.onerror = stopListening;
  if (!STAR.capabilities.includes('voz')) { STAR.capabilities.push('voz'); renderCaps(); addCodeLog('AUTO-MOD: Voz detectada e habilitada','mod'); }
}
function toggleVoice() {
  if (!recognition) { addMessage('star','⚠️ Voz não suportada neste navegador.'); return; }
  isListening ? (recognition.stop(), stopListening()) : (recognition.start(), startListening());
}
function startListening() { isListening=true; document.getElementById('voiceBtn').classList.add('listening'); document.getElementById('voiceBtn').textContent='⏹'; document.getElementById('statusText').textContent='OUVINDO...'; }
function stopListening() { isListening=false; document.getElementById('voiceBtn').classList.remove('listening'); document.getElementById('voiceBtn').textContent='🎤'; document.getElementById('statusText').textContent='ONLINE'; }

// ── CODE MODAL ─────────────────────────────────
function toggleCode() {
  const m = document.getElementById('codeModal');
  if (!m.classList.contains('open')) {
    document.getElementById('codeEditor').textContent =
`// STAR — ESTADO INTERNO AO VIVO (Gemini)
// ${new Date().toLocaleString('pt-BR')}

PERSONALIDADE = ${JSON.stringify(STAR.personality,null,2)}

CAPACIDADES = ${JSON.stringify(STAR.capabilities,null,2)}

PERFIL_USUARIO = ${JSON.stringify(STAR.userProfile,null,2)}

MEMORIAS = ${JSON.stringify(STAR.memory,null,2)}

CONHECIMENTO = ${JSON.stringify(STAR.knowledge,null,2)}

// AUTO-MODIFICAÇÕES (${STAR.selfMods.length}):
${STAR.selfMods.map((s,i)=>`// [${i+1}] ${s}`).join('\n')||'// Nenhuma ainda'}

// Histórico: ${STAR.history.length} mensagens`;
    m.classList.add('open');
  } else { m.classList.remove('open'); }
}

// ── INPUT ──────────────────────────────────────
document.getElementById('userInput').addEventListener('input', function() { this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });
document.getElementById('userInput').addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });

// ── INIT ───────────────────────────────────────
async function init() {
  initStarfield(); renderTraits(); renderCaps(); setupVoice();
  addCodeLog('STAR v2.0-Gemini inicializando...');
  addCodeLog('Conectando ao Google Gemini (gratuito)...');
  showThinking();
  try {
    const reply = await callSTAR("Olá! Esta é nossa primeira conversa. Apresente-se de forma cativante e breve, e pergunte meu nome.");
    hideThinking();
    addMessage('star', reply);
    addCodeLog('Boot completo — STAR online ✓');
  } catch(e) {
    hideThinking();
    addMessage('star', `Olá! Sou **STAR**. Parece que estou com dificuldades de conexão. Verifique se \`GEMINI_KEY\` está configurada no Netlify.`);
    addCodeLog(`Falha no boot: ${e.message}`, 'warn');
  }
}

init();
</script>
